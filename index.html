<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LireMonde</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
      <header>
        <nav class="navbar">
            <img src="images/livre2.png" alt="">
            <h1 class="logo">  LireMonde</h1>
            <ul class="menu">
                <a href="#accueil">Accueil</a>
                <a href="#">À lire</a>
                <a href="admin.html">Admin</a>
            </ul>
          <input type="text" id="searchInput" placeholder="Rechercher...">
        </nav>
    </header>
    <main>

    <!-- HERO -->

    <section id="accueil" class="hero">

        <div class="hero-left">

            <p>
                Bienvenue sur LireMonde,
                votre espace de lecture interactif et dynamique.
                Parcourez des livres inspirants,
                sauvegardez vos favoris et profitez d’une expérience unique.
            </p>

        </div>

    </section>

    <!-- FILTERS -->

    <section class="filters">

        <label>Catégories</label>

        <select id="select">

            <option value="tous">Tous</option>
            <option value="classique">Classique</option>
            <option value="science-fiction">Science-fiction</option>
            <option value="drame">Drame</option>
            <option value="fantasy">Fantasy</option>

        </select>

    </section>

    <!-- LIVRES -->

    <section class="hero-right">

        <h2>Découvrez les meilleurs livres</h2>

        <div id="livres"></div>

    </section>

   <div id="modal" class="modal hidden">

  <div class="modal-content">

    <span id="closeModal">×</span>

    <img id="modalImg" />

    <div class="modal-info">

      <h2 id="modalTitle"></h2>

      <p id="modalAuthor" class="modal-author"></p>

      <span id="modalGenre" class="modal-genre"></span>

      <p id="modalDesc" class="modal-desc"></p>

      <button id="btnLire" class="read-btn">
        ❤️ Ajouter à lire
      </button>

    </div>

  </div>

</div>

    <!-- FAVORIS -->
<section class="favoris" id="listeLire">

  <h2>À lire 📚❤️</h2>

  <div id="livresLire"></div>

</section>
</main>

<footer>

    <p>© 2026 LireMonde - Tous droits réservés</p>

</footer>
</main>
<script src="js/script.js"></script>
</body>
</html>

</body>
</html>
